name: Rest Assured API Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Every day at 11:30 PM IST
    # GitHub Actions cron uses UTC
    - cron: '0 18 * * *'


jobs:

  api-tests:
    name: Run Rest Assured API Tests
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Checkout source code
      # -----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v6


      # -----------------------------------------
      # 2. Setup Java
      # -----------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      # -----------------------------------------
      # 3. Verify Java and Maven
      # -----------------------------------------
      - name: Verify Java Version
        run: |
          java -version
          mvn -version


      # -----------------------------------------
      # 4. Display project structure
      # -----------------------------------------
      - name: Verify Project Structure
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 4 -type f | sort


      # -----------------------------------------
      # 5. Run Rest Assured tests
      # -----------------------------------------
      - name: Run API Automation Tests
        run: |
          mvn clean test \
            --batch-mode \
            --no-transfer-progress \
            -e


      # -----------------------------------------
      # 6. Upload Surefire/TestNG reports
      # -----------------------------------------
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: |
            target/surefire-reports/
            target/*.dump
            target/*.dumpstream
          if-no-files-found: warn
          retention-days: 14


      # -----------------------------------------
      # 7. Upload Extent Report
      # -----------------------------------------
      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: |
            report.html
            test-output/
            reports/
          if-no-files-found: warn
          retention-days: 14


      # -----------------------------------------
      # 8. Upload logs
      # -----------------------------------------
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            logs/
            target/logs/
          if-no-files-found: warn
          retention-days: 14


      # -----------------------------------------
      # 9. Upload screenshots
      # -----------------------------------------
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/
            target/screenshots/
          if-no-files-found: warn
          retention-days: 14


      # -----------------------------------------
      # 10. Print test summary
      # -----------------------------------------
      - name: Test Execution Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Rest Assured API Test Execution Completed"
          echo "=========================================="

          if [ -d "target/surefire-reports" ]; then
            echo ""
            echo "Surefire Reports:"
            find target/surefire-reports -type f | sort
          fi

          echo ""
          echo "Workflow completed."
